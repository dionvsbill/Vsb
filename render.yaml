services:
  - type: web
    name: vsbill-web
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run typecheck && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FINGERPRINT_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_ID
        sync: false
      - key: META_WA_VERIFY_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_ADS_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_AD_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_APP_ID
        sync: false
      - key: TIKTOK_APP_SECRET
        sync: false
      - key: TIKTOK_ADVERTISER_ID
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JFORCE_API_URL
        sync: false
      - key: JFORCE_API_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: vsbill-youtube-audit
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: >-
      node -e "fetch('https://'+process.env.APP_HOST+'/api/cron/youtube-audit',{headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
    schedule: "0 */6 * * *"
    envVars:
      - key: APP_HOST
        fromService:
          type: web
          name: vsbill-web
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: vsbill-web
          envVarKey: CRON_SECRET

  - type: cron
    name: vsbill-expire-registrations
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: >-
      node -e "fetch('https://'+process.env.APP_HOST+'/api/cron/expire-registrations',{headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
    schedule: "15 * * * *"
    envVars:
      - key: APP_HOST
        fromService:
          type: web
          name: vsbill-web
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: vsbill-web
          envVarKey: CRON_SECRET
